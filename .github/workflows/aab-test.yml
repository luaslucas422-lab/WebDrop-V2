name: EXE test (temporary)
on:
  push:
    branches: [aab-test]
jobs:
  prep:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [plain, locked]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        env:
          APP_URL: 'https://en.wikipedia.org/wiki/Ireland'
          APP_NAME: 'Test App'
          PACKAGE_ID: 'app.webdrop.exetest'
          ICON_MODE: favicon
          ORIENTATION: unspecified
          STATUS_COLOR: '#10182b'
          LOCK_SALT: "${{ matrix.kind == 'locked' && 'abcdef12' || '' }}"
          LOCK_HASH: "${{ matrix.kind == 'locked' && '27a1d7f3730afb16b7eb9f2664917b2f5a751c92269ce3cfd89283cdd0b34b44' || '' }}"
          INTERNAL_LINKS: 'true'
          EXTRAS: 'splash,exe,adblock,resume,dark,george'
        run: |
          python3 -m pip install --quiet pillow
          python3 android/scripts/prepare.py
          cp ci-logo.png desktop/watermark.png
          mkdir -p desktop/site && printf '<!doctype html><title>Local Page</title><body style="background:#123;color:#fff;font:30px sans-serif"><h1>Hello from HTML</h1><p id=t>JS not run</p><script>document.getElementById("t").textContent="JS works";document.title="Local Page JS"</script>' > desktop/site/index.html
          python3 -c "import json;c=json.load(open('desktop/config.json'));c.update(site=True,watermark='Lucas Games',watermarkImg=True,url='https://webdrop.local/index.html');c['extras']=c['extras']+['george'];json.dump(c,open('desktop/config.json','w'))"
          echo "::notice title=config ${{ matrix.kind }}::$(cat desktop/config.json | tr -d '\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-settings-${{ matrix.kind }}
          path: |
            desktop/config.json
            desktop/icon.png
            desktop/watermark.png
            desktop/site/
  windows:
    needs: prep
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        kind: [plain, locked]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-settings-${{ matrix.kind }}
          path: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        shell: bash
        working-directory: desktop
        env:
          RUN_NUMBER: '7'
          EXE_NAME: 'Test-App.apk'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          (EXE_NAME="${EXE_NAME%.apk}.exe" node configure.js && npm install --no-audit --no-fund --loglevel=error && npx electron-builder --win --config builder.json --publish never) > "$RUNNER_TEMP/log.txt" 2>&1
          st=$?
          if [ $st -ne 0 ]; then
            msg=$(tail -40 "$RUNNER_TEMP/log.txt" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=exe build failed::$msg"; exit 1
          fi
          echo "::notice title=dist ${{ matrix.kind }}::$(ls -la dist | tr '\n' ' ')"
      - name: Run it
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/dist/win-unpacked/*.exe" | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b0 = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bm0 = New-Object System.Drawing.Bitmap $b0.Width, $b0.Height
          [System.Drawing.Graphics]::FromImage($bm0).CopyFromScreen($b0.Location, [System.Drawing.Point]::Empty, $b0.Size)
          $bm0.Save("$env:RUNNER_TEMP\\hello.png")
          Start-Sleep -Seconds 16
          $alive = -not $p.HasExited
          if ("${{ matrix.kind }}" -eq "locked") {
            Add-Type -AssemblyName Microsoft.VisualBasic
            [Microsoft.VisualBasic.Interaction]::AppActivate($p.Id) | Out-Null
            Start-Sleep -Seconds 1
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.SendKeys]::SendWait("nope{ENTER}")
            Start-Sleep -Seconds 2
            $t1 = (Get-Process | Where-Object { $_.MainWindowTitle -ne "" -and $_.Path -like "*win-unpacked*" } | Select-Object -First 1).MainWindowTitle
            [System.Windows.Forms.SendKeys]::SendWait("test{ENTER}")
            Start-Sleep -Seconds 12
            Write-Output "::notice title=after wrong pw::$t1"
          }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\shot.png")
          $procs = (Get-Process | Where-Object { $_.Path -like "*win-unpacked*" } | Measure-Object).Count
          $title = (Get-Process | Where-Object { $_.MainWindowTitle -ne "" -and $_.Path -like "*win-unpacked*" } | Select-Object -First 1).MainWindowTitle
          $sz = (Get-Item "desktop/dist/Test-App.exe").Length
          Write-Output "::notice title=run ${{ matrix.kind }}::alive=$alive procs=$procs title=$title portableSize=$sz"
      - name: Save screenshot to branch
        shell: bash
        run: |
          git config user.name ci; git config user.email ci@example.com
          git fetch -q origin exe-shots || true
          git checkout -q -B exe-shots
          git rm -rq --cached . ; mkdir -p shots; cp "$RUNNER_TEMP/shot.png" "shots/${{ matrix.kind }}.png"; cp "$RUNNER_TEMP/hello.png" "shots/${{ matrix.kind }}-hello.png" || true
          git add shots/; git commit -qm "shot ${{ matrix.kind }}"
          for i in 1 2 3; do git push -q -f origin exe-shots:exe-shots5-${{ matrix.kind }} && break; sleep 3; done

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build with George
        env: { APP_URL: 'https://example.com', APP_NAME: 'George Test', PACKAGE_ID: 'app.webdrop.georgetest', ICON_MODE: favicon, ORIENTATION: unspecified, WATERMARK: 'Made with WebDrop' }
        run: |
          python3 -m pip install --quiet pillow
          python3 android/scripts/prepare.py
          mkdir -p android/app/src/main/assets/webdrop && cp ci-logo.png android/app/src/main/assets/webdrop/watermark.png
          KS="$RUNNER_TEMP/k.p12"; keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias a -storepass pass123 -keypass pass123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test"
          cd android; set +e
          gradle --no-daemon assembleRelease -PtargetSdk=34 -PappId=app.webdrop.georgetest -PappUrl=https://example.com -Pextras=splash,george,homebtn -PversionCode=7 -PversionName=1.0.7 -PksFile="$KS" -PksPass=pass123 -PksAlias=a > "$RUNNER_TEMP/log.txt" 2>&1
          st=$?; set -e
          if [ $st -ne 0 ]; then msg=$(grep -E "error|What went wrong" "$RUNNER_TEMP/log.txt" | head -20 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=android build failed::$msg"; exit 1; fi
          echo "::notice title=android ok::$(ls -la app/build/outputs/apk/release/ | tr '\n' ' ')"
