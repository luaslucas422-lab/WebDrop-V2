name: Build WebDrop app
run-name: WebDrop app #${{ github.run_number }}

# Builds the WebDrop app itself (this repo's webdrop-app/index.html) with the clean wrapper:
# no watermark, no ads, no Pro lock. Run it from the Actions tab: "Run workflow".

on:
  # Rebuilds by itself when the app page or the Android wrapper changes
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'webdrop-app/**'
      - '.github/workflows/build-webdrop-app.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        default: WebDrop
      package_id:
        description: Android package ID
        default: com.webdrop.app
      status_bar_color:
        description: Status bar colour (empty = system default)
        default: '#070b18'
      api_url:
        description: WebDrop server URL (set automatically by "Deploy WebDrop server"; empty = no accounts / test payments)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the WebDrop page and set the app name
        env:
          APP_NAME: ${{ inputs.app_name || 'WebDrop' }}
          PACKAGE_ID: ${{ inputs.package_id || 'com.webdrop.app' }}
          STATUS_COLOR: ${{ inputs.status_bar_color || '#070b18' }}
          API_URL: ${{ inputs.api_url || vars.WEBDROP_API_URL }}
        run: |
          test -f webdrop-app/index.html || { echo "::error::webdrop-app/index.html is missing"; exit 1; }
          mkdir -p android/app/src/main/assets/www
          cp webdrop-app/index.html android/app/src/main/assets/www/index.html
          python3 - <<'PY'
          import os, re, sys
          from xml.sax.saxutils import escape
          name = os.environ['APP_NAME'].strip()
          pkg = os.environ['PACKAGE_ID'].strip()
          col = os.environ.get('STATUS_COLOR', '').strip()
          if not 1 <= len(name) <= 30 or any(ord(c) < 32 for c in name):
              sys.exit('::error::app_name must be 1-30 characters')
          if not re.fullmatch(r'[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+', pkg):
              sys.exit('::error::package_id must look like com.example.app')
          if col and not re.fullmatch(r'#[0-9A-Fa-f]{6}', col):
              sys.exit('::error::status_bar_color must look like #1a2b3c')
          api = os.environ.get('API_URL', '').strip().rstrip('/')
          if not api and os.path.exists('webdrop-app/server-url.txt'):
              api = open('webdrop-app/server-url.txt').read().strip().rstrip('/')
          if api and not re.fullmatch(r'https://[A-Za-z0-9.-]+(:[0-9]+)?', api):
              sys.exit('::error::api_url must look like https://webdrop-server.yourname.workers.dev')
          page = 'android/app/src/main/assets/www/index.html'
          html = open(page, encoding='utf-8').read()
          if html.count("const WD_API='';") != 1:
              sys.exit('::error::could not find WD_API in webdrop-app/index.html')
          html = html.replace("const WD_API='';", "const WD_API=" + repr(api) + ";")
          open(page, 'w', encoding='utf-8').write(html)
          print('WebDrop server:', api or '(none: test mode)')
          s = escape(name).replace("\\", "\\\\").replace("'", "\\'").replace('"', '\\"')
          if s[:1] in '@?':
              s = '\\' + s
          open('android/app/src/main/res/values/strings.xml', 'w', encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'    <string name="app_name">{s}</string>\n</resources>\n')
          PY

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS_SECRET"
            ALIAS="${KS_ALIAS_SECRET:-webdrop}"
          else
            echo "No KEYSTORE_BASE64 secret: using a one-off key (updates will need an uninstall first)."
            PASS="webdrop-temp"
            ALIAS="webdrop"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=WebDrop App"
          fi
          echo "::add-mask::$PASS"
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          PACKAGE_ID: ${{ inputs.package_id || 'com.webdrop.app' }}
          STATUS_COLOR: ${{ inputs.status_bar_color || '#070b18' }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -PappId="$PACKAGE_ID" \
            -PappUrl="file:///android_asset/www/index.html" \
            -PinternalLinks=false \
            -PdeepScheme=webdrop \
            -PstatusColor="$STATUS_COLOR" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="1.0.$GITHUB_RUN_NUMBER" \
            -PksFile="$KS_FILE" -PksPass="$KS_PASS" -PksAlias="$KS_ALIAS"

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WebDrop.apk"
          gh release create "webdrop-app-$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/WebDrop.apk" \
            --title "WebDrop app #$GITHUB_RUN_NUMBER" \
            --notes "The WebDrop app, built from webdrop-app/index.html." \
            --target "$GITHUB_SHA"
