name: Test Quick Build
run-name: Test Quick Build #${{ github.run_number }}

# Checks that BUILD_TOKEN can start builds (the same request the WebDrop server makes),
# then starts a real test build of https://example.com. Runs when quick-build-test.txt changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/quick-build-test.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a build with BUILD_TOKEN
        env:
          TOKEN: ${{ secrets.BUILD_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error title=BUILD_TOKEN missing::Add the BUILD_TOKEN secret."; exit 1; fi
          ID="t$(date +%s)"
          BODY=$(printf '{"ref":"%s","inputs":{"build_id":"%s","app_url":"https://example.com","app_name":"Test","package_id":"com.example.webdroptest"}}' "${BRANCH:-main}" "$ID")
          CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: webdrop-test" \
            "https://api.github.com/repos/$REPO/actions/workflows/build-apk.yml/dispatches" -d "$BODY")
          if [ "$CODE" != "204" ]; then
            echo "::error title=BUILD_TOKEN was refused ($CODE)::$(head -c 400 resp.json | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=BUILD_TOKEN works::Started test build $ID"
