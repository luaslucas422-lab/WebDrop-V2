name: Quick Build queue
run-name: Quick Build queue

# Starts Quick Builds waiting on the WebDrop server, using GitHub's own built-in access
# (no personal token needed). Each run watches the queue for ~55 minutes (checking every
# 4 seconds). A few minutes before it ends it lines up the next watcher, which starts the
# moment this one finishes, so there is never a gap. The schedule is only a backup.
# The schedule is only a backup in case the chain ever stops.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-build-queue.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: quick-build-queue
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: webdrop-app/server-url.txt
          sparse-checkout-cone-mode: false

      - name: Watch the queue
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request, urllib.error
          server = open('webdrop-app/server-url.txt').read().strip().rstrip('/')
          key = hmac.new(os.environ['CF_TOKEN'].encode(), b'webdrop-queue', hashlib.sha256).hexdigest()
          repo, branch, tok = os.environ['REPO'], os.environ.get('BRANCH') or 'main', os.environ['GH_TOKEN']

          def github(path, payload):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'webdrop-queue', 'Content-Type': 'application/json'})
              urllib.request.urlopen(req, timeout=20)

          end = time.time() + 55 * 60
          started = 0
          handed_over = False
          while time.time() < end:
              if not handed_over and time.time() > end - 4 * 60:
                  # queued now, it waits (concurrency group) and starts as soon as this run ends
                  try:
                      github('/actions/workflows/quick-build-queue.yml/dispatches', {'ref': branch})
                      handed_over = True
                      print('next watcher lined up', flush=True)
                  except Exception as e:
                      print(f'::warning title=Could not line up the next watcher::{e} (will retry)', flush=True)
              try:
                  req = urllib.request.Request(server + '/api/queue', headers={'x-queue-key': key, 'user-agent': 'webdrop-queue'})
                  builds = json.load(urllib.request.urlopen(req, timeout=20)).get('builds', [])
                  for b in builds:
                      try:
                          github('/actions/workflows/build-apk.yml/dispatches', {'ref': branch, 'inputs': b['inputs']})
                          started += 1
                          print(f"::notice title=Started build::{b['id']}", flush=True)
                      except urllib.error.HTTPError as e:
                          print(f"::error title=Could not start {b['id']} ({e.code})::{e.read()[:300].decode('utf8', 'ignore')}", flush=True)
              except Exception as e:
                  print(f'queue check failed: {e}', flush=True)
              time.sleep(4)
          print(f'{started} build(s) started; handing over to the next watcher', flush=True)
          if not handed_over:
              try:
                  github('/actions/workflows/quick-build-queue.yml/dispatches', {'ref': branch})
              except Exception as e:
                  print(f'::warning title=Could not start the next watcher::{e} (the schedule will restart it)')
          PY
