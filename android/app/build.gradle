plugins {
    id 'com.android.application'
}

// Values are passed in by the workflow as -P properties.
def prop = { String key, String fallback ->
    project.hasProperty(key) ? project.property(key).toString() : fallback
}

android {
    namespace 'app.webdrop.generated'
    compileSdk 34

    defaultConfig {
        applicationId prop('appId', 'com.example.mywebapp')
        minSdk 24
        targetSdk 34
        versionCode prop('versionCode', '1').toInteger()
        versionName prop('versionName', '1.0')

        buildConfigField 'String', 'APP_URL', '"' + prop('appUrl', 'https://example.com') + '"'
        buildConfigField 'boolean', 'IMMERSIVE', prop('immersive', 'false')
        buildConfigField 'boolean', 'INTERNAL_LINKS', prop('internalLinks', 'true')
        buildConfigField 'boolean', 'KEEP_SCREEN_ON', prop('keepScreenOn', 'false')
        buildConfigField 'boolean', 'SHOW_PROGRESS', prop('showProgress', 'true')
        buildConfigField 'boolean', 'DESKTOP_MODE', prop('desktopMode', 'false')
        buildConfigField 'boolean', 'ALLOW_ZOOM', prop('allowZoom', 'false')
        buildConfigField 'boolean', 'CONFIRM_EXIT', prop('confirmExit', 'false')
        buildConfigField 'String', 'LOCK_HASH', '"' + prop('lockHash', '') + '"'
        buildConfigField 'String', 'LOCK_SALT', '"' + prop('lockSalt', '') + '"'
        buildConfigField 'String', 'STATUS_COLOR', '"' + prop('statusColor', '') + '"'
        def deepScheme = prop('deepScheme', 'wdapp-' + prop('appId', 'com.example.mywebapp').replace('.', '-').replace('_', '-'))
        buildConfigField 'String', 'DEEP_SCHEME', '"' + deepScheme + '"'
        manifestPlaceholders = [screenOrientation: prop('orientation', 'unspecified'), deepScheme: deepScheme]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (project.hasProperty('ksFile')) {
                storeFile file(project.property('ksFile'))
                storePassword project.property('ksPass')
                keyAlias project.property('ksAlias')
                keyPassword project.property('ksPass')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
